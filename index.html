<style>
:root{--bg:#0d1117;--p:#161b22;--p2:#1c2330;--l:#2a3342;--tx:#e6edf3;--m:#8b98a9;--a:#2f81f7;--r:#f85149;--o:#f0883e;--g:#3fb950}

header{display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--p);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--a)}#q{flex:1;min-width:220px;background:var(--bg);color:var(--tx);border:1px solid var(--l);border-radius:6px;padding:8px 10px}

a{color:var(--a);text-decoration:none}.lnk{color:var(--a);cursor:pointer;text-decoration:underline dotted}

.cv.c{background:#c0392b}.cv.h{background:#d2691e}.cv.m{background:#b8860b}

<script>
const $=s=>document.querySelector(s);
window.onerror=(m,s,l)=>{$("#upd").innerHTML='<span class="bad">Errore JS: '+String(m).replace(/</g,"&lt;")+' (riga '+l+')</span>'};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?esc(u):"";
const fd=s=>{const d=new Date(s);return isNaN(d)?esc(s||""):d.toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})};
let D=null,tab="ov";
const TABS=[["ov","Overview"],["it","🇮🇹 Landscape Italia"],["kev","CVE critiche"],["c2","Botnet C2"],["news","Notizie"],["ioc","IOC"],["bull","🏛 Bollettini istituzionali"],["feeds","Feed"],["search","Ricerca"]];
$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#q").oninput=()=>{if($("#q").value.trim().length>1){tab="search"}render()};

const G=()=>(D&&D.groups&&!Array.isArray(D.groups))?D.groups:{};
const allV=()=>[...D.it_victims,...D.world_victims];
const gl=g=>g?`<a class="lnk" data-g="${esc(g)}">${esc(g)}</a>`:"";
const vrow=(v,cols)=>`<tr data-v="${v.id}">${cols.map(c=>`<td>${c}</td>`).join("")}</tr>`;
const nk=s=>(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const hq=v=>{const g=(D.geo||{})[nk(v.victim)];return g&&g.ok?(g.city||""):""};
const cvb=c=>{const s=c.cvss;if(s==null)return '<span class="cv">n/d</span>';return `<span class="cv ${s>=9?"c":s>=7?"h":s>=4?"m":""}">${Number(s).toFixed(1)}</span>`};
const epp=c=>c.epss==null?"n/d":(c.epss*100).toFixed(1)+"%";

async function load(){
  try{
    const r=await fetch("data.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    D=await r.json();
    ["it_victims","world_victims","kev","c2","news_it","news_en","bulletins","vuln_alerts","cves","status","world","italy"].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});
    if(!D.cves.length)D.cves=D.kev.map(k=>({cve:k.cve,desc:k.name,cvss:null,sev:"",published:"",vendor:k.vendor,product:k.product,ransomware:k.ransomware,added:k.added,kev:true,epss:null,mentions:[],sources:["CISA KEV"]}));
    D.cves.forEach(c=>{if(!Array.isArray(c.sources))c.sources=[];if(!Array.isArray(c.mentions))c.mentions=[]});
    if(!D.mitre||typeof D.mitre!=="object")D.mitre={};
    if(!D.geo||Array.isArray(D.geo))D.geo={};
    D.it_victims.forEach((v,i)=>v.id="i"+i);D.world_victims.forEach((v,i)=>v.id="w"+i);
    $("#upd").textContent="Dati aggiornati: "+fd(D.generated);
  }catch(e){$("#upd").innerHTML='<span class="bad">data.json non raggiungibile ('+esc(e.message)+')</span>'}
  if(!$("#modal").classList.contains("show")&&tab!=="bull"&&tab!=="kev")render();
}
function tbl(h,rows){return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`}
function newsList(a){return a.map(n=>`<div class="news"><a href="${safeUrl(n.link)||"#"}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><br><small>${esc(n.source)} · ${fd(n.date)}</small><br><small>${esc(n.summary)}</small></div>`).join("")||"<i>Nessun dato</i>"}
const relNews=(term)=>{const t=(term||"").toLowerCase();if(t.length<4)return[];return [...D.news_it,...D.news_en].filter(n=>((n.title||"")+" "+(n.summary||"")).toLowerCase().includes(t)).slice(0,6)};
const topN=(arr,k)=>{const m={};arr.forEach(x=>{if(x)m[x]=(m[x]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,k)};

/* ---------- MAPPA ---------- */
const I2={AF:"AFG",AL:"ALB",DZ:"DZA",AR:"ARG",AM:"ARM",AU:"AUS",AT:"AUT",AZ:"AZE",BD:"BGD",BY:"BLR",BE:"BEL",BO:"BOL",BA:"BIH",BR:"BRA",BG:"BGR",CA:"CAN",CL:"CHL",CN:"CHN",CO:"COL",HR:"HRV",CU:"CUB",CY:"CYP",CZ:"CZE",DK:"DNK",EC:"ECU",EG:"EGY",EE:"EST",FI:"FIN",FR:"FRA",GE:"GEO",DE:"DEU",GR:"GRC",HK:"HKG",HU:"HUN",IS:"ISL",IN:"IND",ID:"IDN",IR:"IRN",IQ:"IRQ",IE:"IRL",IL:"ISR",IT:"ITA",JP:"JPN",JO:"JOR",KZ:"KAZ",KE:"KEN",KR:"KOR",KW:"KWT",LV:"LVA",LB:"LBN",LT:"LTU",LU:"LUX",MY:"MYS",MX:"MEX",MD:"MDA",MA:"MAR",NL:"NLD",NZ:"NZL",NG:"NGA",NO:"NOR",PK:"PAK",PA:"PAN",PE:"PER",PH:"PHL",PL:"POL",PT:"PRT",QA:"QAT",RO:"ROU",RU:"RUS",SA:"SAU",RS:"SRB",SG:"SGP",SK:"SVK",SI:"SVN",ZA:"ZAF",ES:"ESP",LK:"LKA",SE:"SWE",CH:"CHE",TW:"TWN",TH:"THA",TN:"TUN",TR:"TUR",UA:"UKR",AE:"ARE",GB:"GBR",UK:"GBR",US:"USA",UY:"URY",VE:"VEN",VN:"VNM"};
let raf=0,zoomIT=false;
function stopMap(){cancelAnimationFrame(raf)}
function pip(x,y,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins}return ins}
const inPoly=(x,y,polys)=>(polys||[]).some(r=>pip(x,y,r));
function showPlace(title,list){
  openM(`<h2>${esc(title)}</h2><small style="color:var(--m)">${list.length} eventi · sede stimata da OpenStreetMap</small>
  <div style="margin-top:10px">${list.map(v=>`<div class="mini"><a class="lnk" data-v="${v.id}">${esc(v.victim)}</a> <small style="color:var(--m)">· ${esc(v.group)} · ${esc(v.sector)} · ${fd(v.date)}${hq(v)?" · "+esc(hq(v)):""}</small></div>`).join("")}</div>
  <div class="warn">⚠ La sede è una stima ricavata da OpenStreetMap in base al nome dell'azienda: può essere una filiale o un omonimo. Le vittime sono rivendicazioni dei criminali, non verificate.</div>`);
}
html

function startMap(){
  stopMap();
  const c=$("#map");if(!c)return;
  const W=c.parentElement.clientWidth,H=Math.max(400,Math.round(W*142/360)),dpr=window.devicePixelRatio||1;
  c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";
  const g=c.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  const world=D.world||[];
  if(!world.length){g.fillStyle="#8b98a9";g.font="13px sans-serif";g.fillText("Mappa non disponibile: esegui il workflow per scaricare i confini dei paesi.",20,H/2);return}
  const wv={cx:0,cy:13,sx:W/360,sy:H/142},iv={cx:12.6,cy:41.6,sx:H/13*.75,sy:H/13};
  let cur={...(zoomIT?iv:wv)},from=cur,to=cur,t0=-1e9;
  const P=(lo,la)=>[(lo-cur.cx)*cur.sx+W/2,(cur.cy-la)*cur.sy+H/2];
  const inv=(x,y)=>[(x-W/2)/cur.sx+cur.cx,cur.cy-(y-H/2)/cur.sy];
  const cent={};
  world.forEach(f=>{
    let best=null,ba=-1;
    (f.p||[]).forEach(r=>{const xs=r.map(p=>p[0]),ys=r.map(p=>p[1]),a=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));if(a>ba){ba=a;best=r}});
    if(best){const lo=best.reduce((s,p)=>s+p[0],0)/best.length,la=best.reduce((s,p)=>s+p[1],0)/best.length;
      cent[f.id]=[lo,la];if(f.n)cent["n:"+f.n.toLowerCase()]=[lo,la]}
  });
  const ITA=(world.find(f=>f.id==="ITA")||{}).p||[];
  const regs=(D.italy&&D.italy.length?D.italy:[{n:"Italia",p:ITA}]).map(r=>{
    const big=(r.p||[]).reduce((m,x)=>x.length>m.length?x:m,[]);
    const xs=big.map(p=>p[0]),ys=big.map(p=>p[1]);
    return {n:r.n,p:r.p||[],cx:big.length?(Math.min(...xs)+Math.max(...xs))/2:0,cy:big.length?(Math.min(...ys)+Math.max(...ys))/2:0}});
  const loc=code=>{const k=String(code||"").trim();if(!k)return null;
    if(k.length===2)return cent[I2[k.toUpperCase()]]||null;
    if(k.length===3&&cent[k.toUpperCase()])return cent[k.toUpperCase()];
    return cent["n:"+k.toLowerCase()]||null};
  const vc={},cc={};let skip=0;
  allV().forEach(v=>{const p=loc(v.country);if(!p){skip++;return}const k=p.join();vc[k]=vc[k]||{p,n:0};vc[k].n++});
  D.c2.forEach(x=>{const p=loc(x.country);if(!p)return;const k=p.join();cc[k]=cc[k]||{p,n:0};cc[k].n++});
  const itn=D.it_victims.length;
  const pts=[...Object.values(vc).map((o,i)=>({...o,col:"240,136,62",ph:(i*.37)%1})),
             ...Object.values(cc).map((o,i)=>({...o,col:"248,81,73",ph:(i*.53)%1}))];

  const cities={},reg={};let nogeo=0;
  D.it_victims.forEach(v=>{
    const gg=(D.geo||{})[nk(v.victim)];
    if(!gg||!gg.ok){nogeo++;return}
    const k=gg.lat.toFixed(2)+","+gg.lon.toFixed(2);
    const o=cities[k]=cities[k]||{city:gg.city||"(sede)",lat:gg.lat,lon:gg.lon,list:[]};o.list.push(v);
    const rn=(regs.find(r=>inPoly(gg.lon,gg.lat,r.p))||{}).n||"Fuori confine";
    (reg[rn]=reg[rn]||[]).push(v);
  });
  const pan=$("#itp");
  pan.innerHTML=`<b>Italia</b><div class="s">${itn} eventi · ${itn-nogeo} con sede stimata · ${nogeo} non localizzati</div>
  <div class="h">Regioni</div>${Object.entries(reg).sort((a,b)=>b[1].length-a[1].length).map(([k,l])=>`<div class="r" data-r="${esc(k)}"><span>${esc(k)}</span><span class="tag">${l.length}</span></div>`).join("")||"<i>nessuna</i>"}
  <div class="h">Città</div>${Object.entries(cities).sort((a,b)=>b[1].list.length-a[1].list.length).slice(0,25).map(([k,o])=>`<div class="r" data-c="${k}"><span>${esc(o.city)}</span><span class="tag">${o.list.length}</span></div>`).join("")||"<i>nessuna</i>"}
  <div class="s" style="margin-top:8px">Sede stimata da OpenStreetMap in base al nome dell'azienda: può non coincidere con la sede amministrativa.</div>`;
  pan.onclick=e=>{const r=e.target.closest("[data-r]"),ci=e.target.closest("[data-c]");
    if(r)showPlace(r.dataset.r,reg[r.dataset.r]);else if(ci)showPlace(cities[ci.dataset.c].city,cities[ci.dataset.c].list)};
  const upd=()=>{$("#itp").style.display=zoomIT?"block":"none";$("#mback").style.display=zoomIT?"block":"none";
    $("#leg").style.display=zoomIT?"none":"block";$("#mapt").textContent=zoomIT?"Italia · sedi stimate delle vittime":"Global threat map · OSINT"};
  function setZoom(z){zoomIT=z;from={...cur};to=z?iv:wv;t0=performance.now();upd()}
  upd();
  $("#mback").onclick=e=>{e.stopPropagation();setZoom(false)};

  const hit=e=>{
    const b=c.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
    if(!zoomIT){const [ix,iy]=P(12.5,42.2);if(Math.hypot(x-ix,y-iy)<45)return{t:"z"};const [lo,la]=inv(x,y);return inPoly(lo,la,ITA)?{t:"z"}:null}
    for(const o of Object.values(cities)){const [px,py]=P(o.lon,o.lat);if(Math.hypot(x-px,y-py)<10)return{t:"c",o}}
    const [lo,la]=inv(x,y);const r=regs.find(r=>inPoly(lo,la,r.p));
    return r&&reg[r.n]?{t:"r",n:r.n}:null};
  c.onmousemove=e=>{c.style.cursor=hit(e)?"pointer":"default"};
  c.onclick=e=>{const h=hit(e);if(!h)return;
    if(h.t==="z")setZoom(true);else if(h.t==="c")showPlace(h.o.city,h.o.list);else showPlace(h.n,reg[h.n])};

  const path=(r)=>{g.beginPath();r.forEach((pt,i)=>{const[x,y]=P(pt[0],pt[1]);i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath()};
  function frame(t){
    const k=Math.max(0,Math.min(1,(t-t0)/900)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const L=(a,b)=>a+(b-a)*e,GL=(a,b)=>Math.exp(Math.log(a)+(Math.log(b)-Math.log(a))*e);
    cur={cx:L(from.cx,to.cx),cy:L(from.cy,to.cy),sx:GL(from.sx,to.sx),sy:GL(from.sy,to.sy)};
    const pr=Math.max(0,Math.min(1,Math.log(cur.sy/wv.sy)/Math.log(iv.sy/wv.sy)));
    g.clearRect(0,0,W,H);g.globalAlpha=1;
    g.fillStyle="#13243d";g.strokeStyle="#2a4a7a";g.lineWidth=.6;
    world.forEach(f=>(f.p||[]).forEach(r=>{path(r);g.fill();g.stroke()}));
    if(pr>0){
      g.globalAlpha=pr;g.fillStyle="#1b4170";g.strokeStyle="#5b8fd0";g.lineWidth=1;
      regs.forEach(r=>r.p.forEach(ring=>{path(ring);g.fill();g.stroke()}));
      if(pr>.8){g.fillStyle="#9fc4ff";g.font="10px sans-serif";g.textAlign="center";
        regs.forEach(r=>{if(!r.n)return;const [x,y]=P(r.cx,r.cy);g.fillText(r.n+(reg[r.n]?" · "+reg[r.n].length:""),x,y)});g.textAlign="left"}
    }
    if(pr<1){
      g.globalAlpha=1-pr;
      pts.forEach(o=>{
        const [x,y]=P(o.p[0],o.p[1]),maxR=10+Math.min(26,Math.sqrt(o.n)*6),kk=((t/2200)+o.ph)%1;
        g.beginPath();g.arc(x,y,2+Math.min(3,o.n/10),0,7);g.fillStyle=`rgb(${o.col})`;g.fill();
        g.beginPath();g.arc(x,y,kk*maxR,0,7);g.strokeStyle=`rgba(${o.col},${(1-kk).toFixed(2)})`;g.lineWidth=1.5;g.stroke();
      });
      const [ix,iy]=P(12.5,42.2);
      for(let j=0;j<2;j++){const kk=((t/1800)+j*.5)%1;g.beginPath();g.arc(ix,iy,kk*34,0,7);g.strokeStyle=`rgba(80,200,255,${(1-kk).toFixed(2)})`;g.lineWidth=2;g.stroke()}
      g.beginPath();g.arc(ix,iy,4,0,7);g.fillStyle="#50c8ff";g.shadowColor="#50c8ff";g.shadowBlur=12;g.fill();g.shadowBlur=0;
      g.fillStyle="#bfe9ff";g.font="bold 11px sans-serif";g.fillText("ITALIA · "+itn+" (clicca)",ix+9,iy-8);
    }
    if(pr>0){
      g.globalAlpha=pr;
      Object.values(cities).forEach(o=>{
        const [x,y]=P(o.lon,o.lat),n=o.list.length,rad=4+Math.min(8,Math.sqrt(n)*2),kk=((t/1600)+(o.lat*7)%1)%1;
        g.beginPath();g.arc(x,y,rad,0,7);g.fillStyle="#f0883e";g.shadowColor="#f0883e";g.shadowBlur=10;g.fill();g.shadowBlur=0;
        g.beginPath();g.arc(x,y,rad+kk*14,0,7);g.strokeStyle=`rgba(240,136,62,${(1-kk).toFixed(2)})`;g.lineWidth=1.5;g.stroke();
        if(pr>.8){g.fillStyle="#fff";g.font="bold 11px sans-serif";g.fillText(o.city+" · "+n,x+rad+4,y+4)}
      });
    }
    g.globalAlpha=1;
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  const last=[...D.it_victims.slice(0,5),...D.world_victims.slice(0,4)];
  $("#tick").innerHTML=last.map(v=>`<div><b>${esc(v.group)}</b> → ${esc((v.victim||"").slice(0,32))} <span style="color:#6b7f9c">(${esc(v.country)})</span></div>`).join("")||"Nessun evento";
  $("#mapn").textContent=skip?`${skip} eventi senza coordinate paese non mostrati`:"";
}

/* ---------- MODALI ---------- */
function openM(html){$("#mbox").innerHTML='<button id="mclose">×</button>'+html;$("#modal").classList.add("show");$("#modal").scrollTop=0}
function closeM(){$("#modal").classList.remove("show")}

const TAC=["reconnaissance","resource-development","initial-access","execution","persistence","privilege-escalation","defense-evasion","credential-access","discovery","lateral-movement","collection","command-and-control","exfiltration","impact"];
function mitreHtml(key){
  const list=(D.mitre||{})[key];
  if(!list||!list.length)return "<i>Nessuna corrispondenza MITRE ATT&amp;CK per questo gruppo (non è censito nel dataset ufficiale o è noto con un altro nome).</i>";
  return list.map(m=>{
    const by={};
    (m.techniques||[]).forEach(t=>((t.tactics&&t.tactics.length)?t.tactics:["altro"]).forEach(x=>(by[x]=by[x]||[]).push(t)));
    const order=[...TAC.filter(x=>by[x]),...Object.keys(by).filter(x=>!TAC.includes(x))];
    return `<div style="margin-bottom:14px"><b>${esc(m.name)}</b> <span class="tag">${esc(m.type)}</span> ${safeUrl(m.url)?`<a href="${safeUrl(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.id)} ↗</a>`:""}
    <small style="color:var(--m)"> · ${(m.techniques||[]).length} tecniche</small>
    ${order.map(tc=>`<div class="tac">${esc(tc)}</div>${by[tc].map(t=>`<a class="tag" title="${esc(t.name)}" href="${safeUrl(t.url)||"#"}" target="_blank" rel="noopener noreferrer">${esc(t.id)} ${esc(t.name)}</a>`).join("")}`).join("")}</div>`}).join("");
}

function showGroup(name){
  const key=name.toLowerCase(),info=G()[key]||{};
  const vi=D.it_victims.filter(v=>(v.group||"").toLowerCase()===key);
  const vw=D.world_victims.filter(v=>(v.group||"").toLowerCase()===key);
  const all=[...vi,...vw];
  const last=all.map(v=>v.date).sort().pop();
  const sec=topN(all.map(v=>v.sector),6),cou=topN(vw.map(v=>v.country),6);
  const news=relNews(name);
  const extra=Object.entries(info.extra||{});
  openM(`<h2>${esc(info.name||name)}</h2><small style="color:var(--m)">Scheda gruppo · dati ransomware.live + MITRE ATT&amp;CK</small><br>
  <a class="big" href="https://www.ransomware.live/group/${encodeURIComponent(name)}" target="_blank" rel="noopener noreferrer">Apri la scheda ufficiale su ransomware.live ↗</a>
  <h4>Profilo (ransomware.live)</h4><p>${esc(info.desc)||"<i>Nessuna descrizione disponibile dalla fonte.</i>"}</p>
  <div class="kv"><div>Leak site noti</div><div>${info.sites??"n/d"}</div>
  ${extra.map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join("")}
  <div>Vittime in Italia</div><div><b>${vi.length}</b> (nei dati caricati)</div>
  <div>Vittime recenti mondo</div><div>${vw.length}</div>
  <div>Ultimo avvistamento</div><div>${last?fd(last):"n/d"}</div>
  <div>Settori colpiti</div><div>${sec.map(s=>`<span class="tag">${esc(s[0])} · ${s[1]}</span>`).join("")||"n/d"}</div>
  <div>Paesi (recenti)</div><div>${cou.map(s=>`<span class="tag">${esc(s[0])} · ${s[1]}</span>`).join("")||"n/d"}</div></div>
  ${(info.profile||[]).length?`<h4>Riferimenti</h4>${info.profile.map(p=>`<div><a href="${safeUrl(p)}" target="_blank" rel="noopener noreferrer">${esc(p.slice(0,80))} ↗</a></div>`).join("")}`:""}
  <h4>Tattiche, tecniche e procedure (MITRE ATT&amp;CK)</h4>${mitreHtml(key)}
  <h4>Ultime vittime italiane</h4>${vi.slice(0,10).map(v=>`<div class="mini"><a class="lnk" data-v="${v.id}">${esc(v.victim)}</a> <small style="color:var(--m)">· ${esc(v.sector)} · ${fd(v.date)}</small></div>`).join("")||"<i>Nessuna nei dati attuali</i>"}
  <h4>Notizie correlate</h4>${newsList(news)}`);
}

function showVictim(id){
  const v=allV().find(x=>x.id===id);if(!v)return;
  const same=allV().filter(x=>x.id!==id&&(x.group||"").toLowerCase()===(v.group||"").toLowerCase()).slice(0,6);
  const news=relNews(v.victim);
  openM(`<h2>${esc(v.victim)||"(senza nome)"}</h2><small style="color:var(--m)">Evento censito su leak site</small>
  <div class="kv" style="margin-top:12px"><div>Gang</div><div>${gl(v.group)}</div>
  <div>Paese</div><div>${esc(v.country)||"n/d"}</div>
  <div>Sede (stima OSM)</div><div>${esc(hq(v))||"n/d"}</div>
  <div>Settore</div><div>${esc(v.sector)||"n/d"}</div>
  <div>Data scoperta</div><div>${fd(v.date)}</div>
  <div>Sito web</div><div>${esc(v.site)||"n/d"}</div>
  <div>Fonte</div><div>${safeUrl(v.link)?`<a href="${safeUrl(v.link)}" target="_blank" rel="noopener noreferrer">Apri scheda originale ↗</a>`:"n/d"}</div></div>
  <h4>Descrizione</h4><p>${esc(v.desc)||"<i>Nessuna descrizione disponibile.</i>"}</p>
  <h4>Altre vittime della stessa gang</h4>${same.map(x=>`<div class="mini"><a class="lnk" data-v="${x.id}">${esc(x.victim)}</a> <small style="color:var(--m)">· ${esc(x.country)} · ${fd(x.date)}</small></div>`).join("")||"<i>Nessuna</i>"}
  <h4>Notizie correlate</h4>${newsList(news)}
  <div class="warn">⚠ Dato OSINT: si tratta di una rivendicazione pubblicata dai criminali sul loro leak site. Non è verificata né confermata dall'organizzazione indicata. La sede è una stima.</div>`);
}

function showCve(id){
  const c=D.cves.find(x=>x.cve===id);if(!c)return;
  openM(`<h2>${esc(c.cve)}</h2><small style="color:var(--m)">${c.sources.map(esc).join(" · ")||"n/d"}</small>
  <div class="kv" style="margin-top:12px"><div>CVSS</div><div>${cvb(c)} ${esc(c.sev)}</div>
  <div>EPSS (prob. sfruttamento)</div><div>${epp(c)}</div>
  <div>Prodotto</div><div>${esc((c.vendor+" "+c.product).trim())||"n/d"}</div>
  <div>Pubblicata</div><div>${esc(c.published)||"n/d"}</div>
  <div>Aggiunta a CISA KEV</div><div>${esc(c.added)||"no"}</div>
  <div>Uso da ransomware</div><div>${c.ransomware==="Known"?'<span class="bad">Sì</span>':esc(c.ransomware)||"n/d"}</div></div>
  <h4>Descrizione</h4><p>${esc(c.desc)||"<i>Nessuna descrizione disponibile.</i>"}</p>
  <h4>Segnalazioni collegate</h4>${c.mentions.map(m=>`<div class="mini"><a href="${safeUrl(m.link)||"#"}" target="_blank" rel="noopener noreferrer">${esc(m.title)}</a> <small style="color:var(--m)">· ${esc(m.kind)} · ${esc(m.source)} · ${fd(m.date)}</small></div>`).join("")||"<i>Nessuna segnalazione da bollettini o notizie.</i>"}
  <h4>Approfondimenti</h4><a href="https://nvd.nist.gov/vuln/detail/${esc(c.cve)}" target="_blank" rel="noopener noreferrer">Scheda NVD ↗</a>`);
}

document.addEventListener("click",e=>{
  if(e.target.id==="modal"||e.target.id==="mclose")return closeM();
  const g=e.target.closest("[data-g]");if(g)return showGroup(g.dataset.g);
  const v=e.target.closest("[data-v]");if(v)return showVictim(v.dataset.v);
  const cv=e.target.closest("[data-cve]");if(cv&&!e.target.closest("a"))return showCve(cv.dataset.cve);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
/* ---------- VISTE ---------- */
const V={
 ov(){const k=[["Vittime IT (leak site)",D.it_victims.length,"var(--r)"],["CVE monitorate",D.cves.length,"var(--o)"],["C2 attivi",D.c2.filter(x=>x.status==="online").length,"var(--a)"],["Notizie",D.news_it.length+D.news_en.length,"var(--g)"]];
  const top=topN(D.it_victims.map(v=>v.group),8);
  return `<div class="card mapc"><canvas id="map"></canvas><div class="mapt" id="mapt">Global threat map · OSINT</div>
  <button class="act mapb" id="mback">← Mappa mondiale</button>
  <div class="leg" id="leg"><div><i style="background:#f0883e"></i>Vittime rivendicate (leak site)</div><div><i style="background:#f85149"></i>Server C2 (paese di hosting)</div><div><i style="background:#50c8ff"></i>Italia · clicca per lo zoom</div></div>
  <div class="itp" id="itp"></div>
  <div class="tick" id="tick"></div><div class="mapn" id="mapn"></div></div>
  <div class="kpis">${k.map(x=>`<div class="card kpi"><div class="v" style="color:${x[2]}">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("")}</div>
  <div class="card"><h3>Gang ransomware più attive contro l'Italia (clicca per il profilo)</h3>${top.map(t=>`<div>${gl(t[0])} <span class="tag">${t[1]}</span></div>`).join("")||"<i>Nessun dato</i>"}</div>
  <div class="card"><h3>Ultime notizie italiane</h3>${newsList(D.news_it.slice(0,6))}</div>`},
 it(){const gs=[...new Set(D.it_victims.map(v=>v.group))].sort();
  return `<div class="card"><h3>Vittime italiane nei leak site (clicca una riga per il dettaglio)</h3>
  <div class="tools"><select id="gf"><option value="">Tutte le gang</option>${gs.map(g=>`<option>${esc(g)}</option>`).join("")}</select>
  <button class="act" id="csv">Esporta CSV</button></div><div id="vt"></div></div>
  <div class="card"><h3>Notizie italiane</h3>${newsList(D.news_it)}</div>
  <div class="card"><h3>Contesto: attacchi recenti nel mondo</h3>${tbl(["Vittima","Gang","Paese","Data"],D.world_victims.slice(0,30).map(v=>vrow(v,[esc(v.victim),gl(v.group),esc(v.country),fd(v.date)])))}</div>`},
 kev(){
  const q=($("#cq")?$("#cq").value:"").toLowerCase(),sf=$("#cs")?$("#cs").value:"";
  const srcs=[...new Set(D.cves.flatMap(c=>c.sources))].sort();
  const f=D.cves.filter(c=>(!sf||c.sources.includes(sf))&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
  return `<div class="card"><h3>CVE critiche e sfruttate · CISA KEV, bollettini, notizie, NVD (clicca una riga)</h3>
  <div class="tools"><input id="cq" class="inp" placeholder="Cerca CVE, prodotto, descrizione..." value="${esc(q)}">
  <select id="cs"><option value="">Tutte le fonti</option>${srcs.map(s=>`<option${s===sf?" selected":""}>${esc(s)}</option>`).join("")}</select>
  <button class="act" id="ccsv">Esporta CSV</button></div>
  ${tbl(["CVE","CVSS","EPSS","Prodotto","Descrizione","Fonti","Ransomware"],f.slice(0,300).map(c=>`<tr data-cve="${esc(c.cve)}"><td><b>${esc(c.cve)}</b></td><td>${cvb(c)}</td><td>${epp(c)}</td><td>${esc((c.vendor+" "+c.product).trim())}</td><td>${esc((c.desc||"").slice(0,140))}</td><td>${c.sources.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</td><td>${c.ransomware==="Known"?'<span class="bad">Sì</span>':""}</td></tr>`))}</div>
  <div class="card"><h3>Segnalazioni critiche senza CVE (es. vulnerabilità note solo per nome)</h3>${newsList(D.vuln_alerts)}</div>`},
 c2(){return `<div class="card"><h3>Botnet C2 – Feodo Tracker</h3>${tbl(["IP","Porta","Malware","Paese","Stato","Ultimo online"],
  D.c2.map(c=>`<tr><td>${esc(c.ip)}</td><td>${esc(c.port)}</td><td>${esc(c.malware)}</td><td>${esc(c.country)}</td><td>${esc(c.status)}</td><td>${esc(c.last_online)}</td></tr>`))}</div>`},
 news(){return `<div class="card"><h3>Italia</h3>${newsList(D.news_it)}</div><div class="card"><h3>Internazionali</h3>${newsList(D.news_en)}</div>`},
 bull(){const q=($("#bq")?$("#bq").value:"").toLowerCase();
  const f=D.bulletins.filter(b=>!q||((b.title||"")+" "+(b.summary||"")+" "+(b.source||"")).toLowerCase().includes(q));
  return `<div class="card"><h3>Bollettini e alert di CSIRT Italia e ACN</h3>
  <div class="tools"><input id="bq" class="inp" placeholder="Cerca nei bollettini..." value="${esc(q)}"></div>
  ${newsList(f).replace("Nessun dato","Nessun bollettino disponibile.")}
  <div class="warn">I bollettini istituzionali sono pubblicati da CSIRT Italia (ACN). Per gli alert completi consulta il sito ufficiale: <a href="https://www.csirt.gov.it/" target="_blank" rel="noopener noreferrer">csirt.gov.it ↗</a></div></div>`},
 ioc(){return `<div class="card"><div class="tools"><button class="act" id="icsv">Esporta CSV</button></div>${tbl(["Tipo","Valore","Contesto"],
  [...D.c2.map(c=>`<tr><td>ip</td><td>${esc(c.ip)}:${esc(c.port)}</td><td>${esc(c.malware)} C2</td></tr>`),
   ...D.cves.map(v=>`<tr><td>cve</td><td>${esc(v.cve)}</td><td>${esc((v.vendor+" "+v.product).trim())}</td></tr>`)])}</div>`},
 feeds(){return `<div class="card"><h3>Stato feed</h3>${tbl(["Feed","Stato","Elementi","Ultimo aggiornamento","Errore"],
  D.status.map(s=>`<tr><td>${esc(s.feed)}</td><td class="${s.ok?"ok":"bad"}">${s.ok?"● OK":"● Errore"}</td><td>${s.count}</td><td>${fd(s.updated)}</td><td>${esc(s.error)}</td></tr>`))}</div>`},
 search(){const q=$("#q").value.trim().toLowerCase();if(q.length<2)return '<div class="card">Digita almeno 2 caratteri nella barra in alto.</div>';
  const m=(o)=>JSON.stringify(o).toLowerCase().includes(q);
  const sec=(t,a,f)=>a.length?`<div class="card"><h3>${t} (${a.length})</h3>${f(a.slice(0,50))}</div>`:"";
  const gm=Object.values(G()).filter(g=>((g.name||"")+" "+(g.desc||"")).toLowerCase().includes(q));
  return (sec("Threat actor / gang",gm,a=>a.map(g=>`<div class="mini">${gl(g.name)} <small style="color:var(--m)">${esc((g.desc||"").slice(0,120))}</small></div>`).join(""))
   +sec("Vittime Italia",D.it_victims.filter(m),a=>tbl(["Vittima","Gang","Settore","Data"],a.map(v=>vrow(v,[esc(v.victim),gl(v.group),esc(v.sector),fd(v.date)]))))
   +sec("Vittime mondo",D.world_victims.filter(m),a=>tbl(["Vittima","Gang","Paese"],a.map(v=>vrow(v,[esc(v.victim),gl(v.group),esc(v.country)]))))
   +sec("CVE",D.cves.filter(m),a=>tbl(["CVE","CVSS","Prodotto","Descrizione"],a.map(c=>`<tr data-cve="${esc(c.cve)}"><td>${esc(c.cve)}</td><td>${cvb(c)}</td><td>${esc((c.vendor+" "+c.product).trim())}</td><td>${esc((c.desc||"").slice(0,120))}</td></tr>`)))
   +sec("C2",D.c2.filter(m),a=>tbl(["IP","Malware","Paese"],a.map(c=>`<tr><td>${esc(c.ip)}</td><td>${esc(c.malware)}</td><td>${esc(c.country)}</td></tr>`)))
   +sec("Bollettini istituzionali",D.bulletins.filter(m),newsList)
   +sec("Segnalazioni critiche",D.vuln_alerts.filter(m),newsList)
   +sec("Notizie",[...D.news_it,...D.news_en].filter(m),newsList))||'<div class="card">Nessun risultato.</div>'}
};
function dl(name,rows){const c=rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download=name;a.click()}
function keepFocus(id,fn){const i=$("#"+id);if(i)i.oninput=()=>{fn();const j=$("#"+id);j.focus();j.setSelectionRange(j.value.length,j.value.length)}}
function render(){
  stopMap();
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(!D){$("#main").innerHTML='<div class="card">Nessun dato disponibile.</div>';return}
  $("#main").innerHTML=V[tab]();
  if(tab==="ov")startMap();
  if(tab==="bull")keepFocus("bq",render);
  if(tab==="kev"){keepFocus("cq",render);const s=$("#cs");if(s)s.onchange=render;
    const b=$("#ccsv");if(b)b.onclick=()=>dl("cve.csv",[["cve","cvss","epss","prodotto","fonti","descrizione"],...D.cves.map(c=>[c.cve,c.cvss,c.epss,(c.vendor+" "+c.product).trim(),c.sources.join("|"),c.desc])])}
  if(tab==="it"){const draw=()=>{const g=$("#gf").value;
    $("#vt").innerHTML=tbl(["Vittima","Gang","Settore","Sede stimata","Scoperta","Sito"],D.it_victims.filter(v=>!g||v.group===g).map(v=>vrow(v,[esc(v.victim),gl(v.group),esc(v.sector),esc(hq(v)),fd(v.date),esc(v.site)])))};
    $("#gf").onchange=draw;draw();
    $("#csv").onclick=()=>dl("vittime_italia.csv",[["vittima","gang","settore","sede_stimata","data","sito"],...D.it_victims.map(v=>[v.victim,v.group,v.sector,hq(v),v.date,v.site])])}
  if(tab==="ioc")$("#icsv").onclick=()=>dl("ioc.csv",[["tipo","valore","contesto"],...D.c2.map(c=>["ip",c.ip+":"+c.port,c.malware]),...D.cves.map(v=>["cve",v.cve,(v.vendor+" "+v.product).trim()])]);
}
window.addEventListener("resize",()=>{if(tab==="ov"&&D)startMap()});
load();setInterval(load,60000);
</script></body></html>
