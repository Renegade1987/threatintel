<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThreatIntel Hub</title>
<style>
:root{--bg:#0d1117;--p:#161b22;--p2:#1c2330;--l:#2a3342;--tx:#e6edf3;--m:#8b98a9;--a:#2f81f7;--r:#f85149;--o:#f0883e;--g:#3fb950}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Segoe UI,Arial,sans-serif;font-size:14px}
header{display:flex;gap:14px;align-items:center;padding:12px 20px;background:var(--p);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:16px;margin:0;color:var(--a)}#q{flex:1;min-width:220px;background:var(--bg);color:var(--tx);border:1px solid var(--l);border-radius:6px;padding:8px 10px}
#upd{color:var(--m);font-size:12px}
nav{display:flex;gap:4px;padding:8px 20px;flex-wrap:wrap;border-bottom:1px solid var(--l)}
nav button{background:none;border:0;color:var(--m);padding:8px 12px;cursor:pointer;border-radius:6px;font-size:14px}
nav button.on{background:var(--p2);color:var(--tx)}
main{padding:20px}.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:14px;margin-bottom:16px;overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi .v{font-size:28px;font-weight:700}.kpi .l{color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--l);vertical-align:top}
th{color:var(--m);font-size:12px}tr:hover td{background:var(--p2)}
a{color:var(--a);text-decoration:none}.tag{background:var(--p2);border:1px solid var(--l);border-radius:4px;padding:1px 6px;font-size:11px}
.bad{color:var(--r)}.ok{color:var(--g)}.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
select,button.act{background:var(--p2);color:var(--tx);border:1px solid var(--l);border-radius:6px;padding:7px 10px}
.news{padding:10px 0;border-bottom:1px solid var(--l)}.news small{color:var(--m)}
section{display:none}section.on{display:block}h3{margin:0 0 10px;color:var(--m);font-size:13px;text-transform:uppercase}
</style></head><body>
<header><h1>🛡 ThreatIntel Hub</h1>
<input id="q" placeholder="Ricerca globale: CVE, IP, azienda, gang, malware, notizie...">
<span id="upd">Caricamento…</span></header>
<nav id="nav"></nav><main id="main"></main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?esc(u):"#";
const fd=s=>{const d=new Date(s);return isNaN(d)?esc(s||""):d.toLocaleString("it-IT",{dateStyle:"short",timeStyle:"short"})};
let D=null,tab="it";
const TABS=[["ov","Overview"],["it","🇮🇹 Landscape Italia"],["kev","Vulnerabilità KEV"],["c2","Botnet C2"],["news","Notizie"],["ioc","IOC"],["feeds","Feed"],["search","Ricerca"]];
$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#q").oninput=()=>{if($("#q").value.trim().length>1){tab="search"}render()};

async function load(){
  try{const r=await fetch("data.json?_="+Date.now(),{cache:"no-store"});D=await r.json();
    $("#upd").textContent="Dati aggiornati: "+fd(D.generated)}
  catch(e){$("#upd").innerHTML='<span class="bad">data.json non raggiungibile</span>'}
  render();
}
function tbl(h,rows){return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`}
function newsList(a){return a.map(n=>`<div class="news"><a href="${safeUrl(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><br><small>${esc(n.source)} · ${fd(n.date)}</small><br><small>${esc(n.summary)}</small></div>`).join("")||"<i>Nessun dato</i>"}

const V={
 ov(){const k=[["Vittime IT (leak site)",D.it_victims.length,"var(--r)"],["CVE sfruttate (KEV)",D.kev.length,"var(--o)"],["C2 attivi",D.c2.filter(x=>x.status==="online").length,"var(--a)"],["Notizie",D.news_it.length+D.news_en.length,"var(--g)"]];
  const groups={};D.it_victims.forEach(v=>groups[v.group]=(groups[v.group]||0)+1);
  const top=Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,8);
  return `<div class="kpis">${k.map(x=>`<div class="card kpi"><div class="v" style="color:${x[2]}">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("")}</div>
  <div class="card"><h3>Gang ransomware più attive contro l'Italia</h3>${top.map(t=>`<div>${esc(t[0])} <span class="tag">${t[1]}</span></div>`).join("")||"<i>Nessun dato</i>"}</div>
  <div class="card"><h3>Ultime notizie italiane</h3>${newsList(D.news_it.slice(0,6))}</div>`},
 it(){const gs=[...new Set(D.it_victims.map(v=>v.group))].sort();
  return `<div class="card"><h3>Vittime italiane nei leak site (ransomware.live)</h3>
  <div class="tools"><select id="gf"><option value="">Tutte le gang</option>${gs.map(g=>`<option>${esc(g)}</option>`).join("")}</select>
  <button class="act" id="csv">Esporta CSV</button></div><div id="vt"></div></div>
  <div class="card"><h3>Notizie italiane</h3>${newsList(D.news_it)}</div>
  <div class="card"><h3>Contesto: attacchi recenti nel mondo</h3>${tbl(["Vittima","Gang","Paese","Data"],D.world_victims.slice(0,30).map(v=>`<tr><td>${esc(v.victim)}</td><td>${esc(v.group)}</td><td>${esc(v.country)}</td><td>${fd(v.date)}</td></tr>`))}</div>`},
 kev(){return `<div class="card"><h3>CISA KEV – vulnerabilità sfruttate attivamente</h3>${tbl(["CVE","Vendor/Prodotto","Nome","Aggiunta","Scadenza","Ransomware"],
  D.kev.map(v=>`<tr><td><a href="https://nvd.nist.gov/vuln/detail/${esc(v.cve)}" target="_blank" rel="noopener noreferrer">${esc(v.cve)}</a></td><td>${esc(v.vendor)} ${esc(v.product)}</td><td>${esc(v.name)}</td><td>${esc(v.added)}</td><td>${esc(v.due)}</td><td>${v.ransomware==="Known"?'<span class="bad">Sì</span>':esc(v.ransomware)}</td></tr>`))}</div>`},
 c2(){return `<div class="card"><h3>Botnet C2 – Feodo Tracker</h3>${tbl(["IP","Porta","Malware","Paese","Stato","Ultimo online"],
  D.c2.map(c=>`<tr><td>${esc(c.ip)}</td><td>${esc(c.port)}</td><td>${esc(c.malware)}</td><td>${esc(c.country)}</td><td>${esc(c.status)}</td><td>${esc(c.last_online)}</td></tr>`))}</div>`},
 news(){return `<div class="card"><h3>Italia</h3>${newsList(D.news_it)}</div><div class="card"><h3>Internazionali</h3>${newsList(D.news_en)}</div>`},
 ioc(){return `<div class="card"><div class="tools"><button class="act" id="icsv">Esporta CSV</button></div>${tbl(["Tipo","Valore","Contesto"],
  [...D.c2.map(c=>`<tr><td>ip</td><td>${esc(c.ip)}:${esc(c.port)}</td><td>${esc(c.malware)} C2</td></tr>`),
   ...D.kev.map(v=>`<tr><td>cve</td><td>${esc(v.cve)}</td><td>${esc(v.vendor)} ${esc(v.product)}</td></tr>`)])}</div>`},
 feeds(){return `<div class="card"><h3>Stato feed</h3>${tbl(["Feed","Stato","Elementi","Ultimo aggiornamento","Errore"],
  D.status.map(s=>`<tr><td>${esc(s.feed)}</td><td class="${s.ok?"ok":"bad"}">${s.ok?"● OK":"● Errore"}</td><td>${s.count}</td><td>${fd(s.updated)}</td><td>${esc(s.error)}</td></tr>`))}</div>`},
 search(){const q=$("#q").value.trim().toLowerCase();if(q.length<2)return '<div class="card">Digita almeno 2 caratteri nella barra in alto.</div>';
  const m=(o)=>JSON.stringify(o).toLowerCase().includes(q);
  const sec=(t,a,f)=>a.length?`<div class="card"><h3>${t} (${a.length})</h3>${f(a.slice(0,50))}</div>`:"";
  return sec("Vittime Italia",D.it_victims.filter(m),a=>tbl(["Vittima","Gang","Settore","Data"],a.map(v=>`<tr><td>${esc(v.victim)}</td><td>${esc(v.group)}</td><td>${esc(v.sector)}</td><td>${fd(v.date)}</td></tr>`)))
   +sec("Vittime mondo",D.world_victims.filter(m),a=>tbl(["Vittima","Gang","Paese"],a.map(v=>`<tr><td>${esc(v.victim)}</td><td>${esc(v.group)}</td><td>${esc(v.country)}</td></tr>`)))
   +sec("CVE KEV",D.kev.filter(m),a=>tbl(["CVE","Prodotto","Nome"],a.map(v=>`<tr><td>${esc(v.cve)}</td><td>${esc(v.vendor)} ${esc(v.product)}</td><td>${esc(v.name)}</td></tr>`)))
   +sec("C2",D.c2.filter(m),a=>tbl(["IP","Malware","Paese"],a.map(c=>`<tr><td>${esc(c.ip)}</td><td>${esc(c.malware)}</td><td>${esc(c.country)}</td></tr>`)))
   +sec("Notizie",[...D.news_it,...D.news_en].filter(m),newsList)||'<div class="card">Nessun risultato.</div>'}
};
function dl(name,rows){const c=rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download=name;a.click()}
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(!D){$("#main").innerHTML='<div class="card">Nessun dato disponibile.</div>';return}
  $("#main").innerHTML=V[tab]();
  if(tab==="it"){const draw=()=>{const g=$("#gf").value;
    $("#vt").innerHTML=tbl(["Vittima","Gang","Settore","Scoperta","Sito"],D.it_victims.filter(v=>!g||v.group===g).map(v=>`<tr><td>${esc(v.victim)}</td><td><span class="tag">${esc(v.group)}</span></td><td>${esc(v.sector)}</td><td>${fd(v.date)}</td><td>${esc(v.site)}</td></tr>`))};
    $("#gf").onchange=draw;draw();
    $("#csv").onclick=()=>dl("vittime_italia.csv",[["vittima","gang","settore","data","sito"],...D.it_victims.map(v=>[v.victim,v.group,v.sector,v.date,v.site])])}
  if(tab==="ioc")$("#icsv").onclick=()=>dl("ioc.csv",[["tipo","valore","contesto"],...D.c2.map(c=>["ip",c.ip+":"+c.port,c.malware]),...D.kev.map(v=>["cve",v.cve,v.vendor+" "+v.product])]);
}
load();setInterval(load,60000);
</script></body></html>
